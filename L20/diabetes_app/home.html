<html>
	<head>
		<title>
			Diabetes Classifier App by kamal Sir
		</title>
		<style>
			*{
				font-size:30px;
				text-align:center;
				font-family:Cambria;
			}
			body{
				background-color:linen;
			}
			.fc{
				border:solid;
				padding:2%;
				width:50%;
				margin:auto;
				border-radius:30px;
			}
		</style>
	</head>
	<body>
		<h1>Fill the form</h1>
		<div class="fc">
			<form method="POST">
				<label>Age</label>
				<input type="number"
					step="0.1"
					name="age"
					placeholder="Enter Age"
					min="1"
					max="120"
					style="width:500px"
					required/>
				<br/><br/>
				<label>BMI</label>
				<input type="number"
					step="0.1"
					name="bmi"
					placeholder="Enter BMI"
					min="0"
					max="50"
					style="width:500px"
					required/>
				<br/><br/>
				<label>Fasting Sugar</label>
				<input type="number"
					step="0.1"
					name="fs"
					placeholder="Enter Fasting Sugar"
					min="0"
					max="300"
					style="width:500px"
					required/>
				<br/><br/>
				<label>HbA1c</label>
				<input type="number"
					step="0.1"
					name="hb"
					placeholder="Enter HbA1c"
					min="0"
					max="100"
					style="width:500px"
					required/>
				<br/><br/>
				<label>Select Gender</label>
				<br/>
				<input type="radio"
					name="ge"
					value="1"
					checked=true
				/>Female
				<input type="radio"
					name="ge"
					value="2"
				/>Male 
				<br/><br/>
				<label>Do u have HyperTension</label>
				<br/>
				<input type="radio"
					name="ht"
					value="1"
					checked=true
				/>No
				<input type="radio"
					name="ht"
					value="2"
				/>Yes 
				<br/><br/>
				<label>Family History</label>
				<br/>
				<input type="radio"
					name="fh"
					value="1"
					checked=true
				/>No
				<input type="radio"
					name="fh"
					value="2"
				/>Yes 
				<br/><br/>
				<input type="submit" />
			</form>
		</div>
		<h2>
			{{ msg }}
		</h2>
	</body>
</html>
