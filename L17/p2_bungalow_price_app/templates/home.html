<html>
	<head>
		<title>
			Bungalow Price Data Capture App
		</title>
		<style>
			*{
				font-size:40px;
				text-align:center;
			}
			body{
				background-color:#ffe6ff;	
			}
			.fc{
				border:solid;
				padding:2%;
				width:60%;
				margin:auto;
				border-radius:40px;	
			}
		</style>
	</head>
	<body>
		<h1>Bungalow Price Data Capture App</h1>
		
		<div class="fc">
			<form method="POST">
				<input type="text"
					name="location"
					placeholder="Enter location"
					required/>
				<br/><br/>
				<input type="num"
					step="any"
					name="area"
					placeholder="Enter area in square feet"
					required
					/>
				<br/><br/>
				<input type="num"
					step="any"
					name="price"
					placeholder="Enter price in crores"
					required
					/>
				<br/><br/>
				<input type="submit"
					value="Save Data"/>
			</form>
		</div>
		<h2>
			{{ msg }}
		</h2>
	</body>
</html>
