<html>
	<head>
		<title>
			Lonavla Housing Price Predictor App
		</title>
		<style>
			*{
				font-size:30px;
				text-align:center;
				font-family:Cambria;
			}
			body{
				background-color:linen;
			}
			.fc{
				border:solid;
				padding:2%;
				width:50%;
				margin:auto;
				border-radius:30px;
			}
		</style>
	</head>
	<body>
		<h1>Lonavla Housing Price Predictor App</h1>
		<div class="fc">
			<form method ="POST">
				<label>Area</label>
				<input type="number"
					step="0.01"
					name="area"
					placeholder="Enter Area in Square Feet"
					min=1000
					required/>
				<br/><br/>
				<input type="submit"
					value="Predict Price"/>
			</form>
		</div>
		<h2>
			{{ msg }}
		</h2>
	</body>
</html>
