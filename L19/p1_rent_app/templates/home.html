<html>
	<head>
		<title>
			Rent Predictor App
		</title>
		<style>
			*{
				font-size:30px;
				text-align:center;
				font-family:Cambria;
			}
			body{
				background-color:linen;
			}
			.fc{
				border:solid;
				padding:2%;
				width:50%;
				margin:auto;
				border-radius:30px;
			}
		</style>
	</head>
	<body>
		<h1>Fill the form to get Rent Estimate</h1>
		<div class="fc">
			<form method="POST">
				<label>BHK</label>
				<input type="number"
					step="0.5"
					name="bhk"
					placeholder="Enter Number of BHK"
					min="1"
					max="3"
					style="width:500px"
					required/>
				<br/><br/>
				<label>Size</label>
				<input type="number"
					step="0.01"
					name="size"
					placeholder="Enter Size in Square Feet"
					min="300"
					max="1100"
					style="width:500px"
					required/>
				<br/><br/>
				<label>Bathroom</label>
				<input type="number"
					step="0.5"
					name="bath"
					placeholder="Enter Number of Bathrooms"
					min="1"
					max="4"
					style="width:500px"
					required/>
				<br/><br/>
				<label>Select One</label>
				<br/>
				<input type="radio"
					name="fur"
					value="1"
					checked=true
				/>Furnished
				<input type="radio"
					name="fur"
					value="2"
				/>Semi-Furnished 
				<br/><br/>
				<input type="radio"
					name="fur"
					value="3"
				/>Unfurnished
				<br/><br/>
				<input type="submit"
					value="Get Me Rent Estimate"
				/>
			</form>
		</div>
		<h2>
			{{ msg }}
		</h2>
	</body>
</html>
